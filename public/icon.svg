<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3828"/>
      <stop offset="50%" stop-color="#0e533c"/>
      <stop offset="100%" stop-color="#072218"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Border accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#126b4d" stroke-width="4"/>

  <!-- Inner railway badge -->
  <g filter="url(#shadow)" transform="translate(96, 76)">
    <!-- Locomotive Cab Shape -->
    <path d="M40 80 C40 35, 75 0, 160 0 C245 0, 280 35, 280 80 L280 250 C280 280, 260 300, 230 300 L90 300 C60 300, 40 280, 40 250 Z" fill="#ffffff"/>

    <!-- Aerodynamic front windshield (Vande Bharat style) -->
    <path d="M60 70 C60 50, 90 30, 160 30 C230 30, 260 50, 260 70 L250 140 C250 150, 230 155, 160 155 C90 155, 70 150, 70 140 Z" fill="#0f172a"/>

    <!-- Glare reflection on glass -->
    <path d="M85 50 C120 40, 140 40, 155 42 L150 140 C120 140, 100 135, 90 130 Z" fill="#38bdf8" opacity="0.4"/>

    <!-- Headlights (Twin high-intensity LED) -->
    <circle cx="85" cy="220" r="18" fill="url(#gold)"/>
    <circle cx="85" cy="220" r="10" fill="#fef08a"/>
    <circle cx="235" cy="220" r="18" fill="url(#gold)"/>
    <circle cx="235" cy="220" r="10" fill="#fef08a"/>

    <!-- Central Indian Railway Crest Emblem Plate -->
    <circle cx="160" cy="220" r="24" fill="#0e533c" stroke="url(#gold)" stroke-width="4"/>
    <text x="160" y="226" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#fbbf24" text-anchor="middle">IR</text>

    <!-- Cowcatcher / Aerodynamic Pilot -->
    <path d="M50 280 L270 280 L290 320 L30 320 Z" fill="#041f15"/>
    <line x1="80" y1="285" x2="65" y2="315" stroke="url(#gold)" stroke-width="4"/>
    <line x1="120" y1="285" x2="110" y2="315" stroke="url(#gold)" stroke-width="4"/>
    <line x1="160" y1="285" x2="160" y2="315" stroke="url(#gold)" stroke-width="4"/>
    <line x1="200" y1="285" x2="210" y2="315" stroke="url(#gold)" stroke-width="4"/>
    <line x1="240" y1="285" x2="255" y2="315" stroke="url(#gold)" stroke-width="4"/>

    <!-- Twin Track Rails -->
    <line x1="-10" y1="340" x2="330" y2="340" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="-30" y1="365" x2="350" y2="365" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="470" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" fill="#f8fafc" letter-spacing="4" text-anchor="middle">MY STATION</text>
</svg>
